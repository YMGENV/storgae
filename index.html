<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Drive – Drive</title>
<script>if(localStorage.theme!=='light')document.documentElement.classList.add('dark')</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
<div id="app"></div>
<script type="module">import('./app.js').then(m=>m.boot('drive')).catch(e=>{document.body.innerHTML='<pre style="color:#f87171;padding:20px;white-space:pre-wrap">Error: '+e.message+'</pre>'});</script>
</body>
</html>
