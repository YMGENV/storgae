<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in – Drive</title>
<script>if(localStorage.theme!=='light')document.documentElement.classList.add('dark')</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
<div class="w-full max-w-sm rounded-2xl border border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-900 p-8">
  <h1 class="mb-1 text-2xl font-semibold">☁️ Drive</h1>
  <p class="mb-6 text-sm text-slate-500">Sign in to open your files.</p>
  <input id="email" type="email" placeholder="Email" class="mb-3 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2 text-sm outline-none focus:ring-2 ring-blue-500">
  <input id="pw" type="password" placeholder="Password (6+ characters)" class="mb-3 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2 text-sm outline-none focus:ring-2 ring-blue-500">
  <p id="err" class="mb-3 hidden text-sm text-red-500"></p>
  <button id="in" class="mb-2 w-full rounded-full bg-blue-600 py-2 text-sm font-medium text-white hover:bg-blue-700">Sign in</button>
  <button id="up" class="w-full rounded-full border border-slate-300 dark:border-slate-600 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800">Create account</button>
</div>
<script type="module">
import { authenticate, sb1 } from './app.js';
const $ = (s) => document.querySelector(s);
if ((await sb1.auth.getSession()).data.session) location.href = 'index.html';
async function go(mode) {
  $('#err').classList.add('hidden');
  try { await authenticate(mode, $('#email').value.trim(), $('#pw').value); location.href = 'index.html'; }
  catch (e) { $('#err').textContent = e.message; $('#err').classList.remove('hidden'); }
}
$('#in').onclick = () => go('signin');
$('#up').onclick = () => go('signup');
</script>
</body>
</html>
